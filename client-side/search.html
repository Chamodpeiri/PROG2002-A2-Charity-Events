<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Events</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div>
            <h1>Helping Hands Charity</h1>
            <p class="header-subtitle">Supporting communities through meaningful events</p>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search Events</a>
        </nav>
    </header>

    <main>

        <section class="page-intro">
            <h2>Search Charity Events</h2>
            <p>Find upcoming charity events by date, location, or category.</p>
        </section>

        <section class="search-section">

            <form id="search-form">

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="Enter location">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit">Search Events</button>
                    <button type="button" id="clear-filters" class="secondary-button">
                        Clear Filters
                    </button>
                </div>

            </form>

        </section>

        <p id="message"></p>

        <section class="results-section">
            <div id="search-results"></div>
        </section>

    </main>

    <script src="js/search.js"></script>

</body>
</html>
